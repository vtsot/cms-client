services:
    php-fpm:
        build:
            context: ./.docker/php-fpm
            args:
                PHP_VERSION: ${COMPOSE_PHP_VERSION:-8.4}
                USER_ID: ${COMPOSE_USER_ID:-1000}
                GROUP_ID: ${COMPOSE_GROUP_ID:-1000}
        restart: unless-stopped
        extra_hosts:
            - "cms-admin.local:host-gateway"
            - "cms-client.local:host-gateway"
            - "admin.cms-admin.local:host-gateway"
            - "api.cms-admin.local:host-gateway"
        volumes:
            - ./:/var/www/html:rw
        networks:
            - cms-admin_app
            - shared-smtp

    nginx:
        build: ./.docker/nginx
        restart: unless-stopped
        volumes_from:
            - php-fpm
        networks:
            reverse-proxy:
            cms-admin_app:
                aliases:
                    - cms-admin.local
                    - admin.cms-admin.local
                    - api.cms-admin.local
        expose:
            - "80"
        environment:
            - VIRTUAL_PORT=80
            - VIRTUAL_HOST=cms-admin.local,admin.cms-admin.local,api.cms-admin.local
            - HTTPS_METHOD=redirect
            - SELF_SIGNED_HOST=admin.local,admin.cms-admin.local,api.cms-admin.local
        depends_on:
            - php-fpm

networks:
    reverse-proxy:
        name: reverse-proxy
        external: true
    shared-smtp:
        name: shared-smtp
        external: true
    cms-admin_app:
        driver: bridge
